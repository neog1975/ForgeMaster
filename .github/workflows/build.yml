name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-latest
            artifact: ForgeMaster-macOS
          - name: Windows
            os: windows-latest
            artifact: ForgeMaster-Windows

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DFORGE_COPY_AFTER_BUILD=OFF -DFORGE_VST3_MANIFEST=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DFORGE_COPY_AFTER_BUILD=OFF -DFORGE_VST3_MANIFEST=OFF
          fi

      - name: Build
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build-log.txt

      - name: Report build log tail
        if: failure()
        shell: bash
        run: |
          tail -n 40 build-log.txt | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
          echo "::error title=Build log tail::$(cat tail.txt)"

      - name: UI snapshot (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: |
          ./build/AutoMasterTest_artefacts/Release/AutoMasterTest --snapshot build/ui-simple.png
          ./build/AutoMasterTest_artefacts/Release/AutoMasterTest --snapshot build/ui-advanced.png adv

      - name: Update screenshots in docs/
        if: runner.os == 'macOS' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          [ -f build/ui-simple.png ] || exit 0
          mkdir -p docs
          cp build/ui-simple.png build/ui-advanced.png docs/ 2>/dev/null || true
          git add docs/*.png
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update UI screenshots [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main

      - name: Collect plug-ins
        shell: bash
        run: |
          mkdir -p package
          ART=build/ForgeMaster_artefacts/Release
          cp -R "$ART/VST3/Forge Master.vst3" package/
          if [ -d "$ART/AU/Forge Master.component" ]; then cp -R "$ART/AU/Forge Master.component" package/; fi
          if [ -d "$ART/Standalone/Forge Master.app" ]; then cp -R "$ART/Standalone/Forge Master.app" package/; fi
          if [ -f "$ART/Standalone/Forge Master.exe" ]; then cp "$ART/Standalone/Forge Master.exe" package/; fi
          cp build/ui-*.png package/ 2>/dev/null || true
          cp README.md LICENSE package/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package
