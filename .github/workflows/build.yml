name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-latest
            artifact: ForgeMaster-macOS
          - name: Windows
            os: windows-latest
            artifact: ForgeMaster-Windows

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DFORGE_COPY_AFTER_BUILD=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DFORGE_COPY_AFTER_BUILD=OFF
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: UI snapshot (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./build/AutoMasterTest_artefacts/Release/AutoMasterTest --snapshot build/ui-simple.png
          ./build/AutoMasterTest_artefacts/Release/AutoMasterTest --snapshot build/ui-advanced.png advanced

      - name: Collect plug-ins
        shell: bash
        run: |
          mkdir -p package
          ART=build/ForgeMaster_artefacts/Release
          cp -R "$ART/VST3/Forge Master.vst3" package/
          if [ -d "$ART/AU/Forge Master.component" ]; then cp -R "$ART/AU/Forge Master.component" package/; fi
          if [ -d "$ART/Standalone/Forge Master.app" ]; then cp -R "$ART/Standalone/Forge Master.app" package/; fi
          if [ -f "$ART/Standalone/Forge Master.exe" ]; then cp "$ART/Standalone/Forge Master.exe" package/; fi
          cp build/ui-*.png package/ 2>/dev/null || true
          cp README.md LICENSE package/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package
